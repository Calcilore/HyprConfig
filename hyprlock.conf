general {
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    # color = rgba(25, 20, 20, 1.0)
    blur_passes = 4
    blur_size = 16
    noise = 0
    contrast = 1
    brightness = 0.33
    vibrancy = 0
    vibrancy_darkness = 0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(ff8800ee) rgba(ff4400ee) 45deg
    check_color=rgba(994400ee) rgba(992200ee) 120deg
    fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = Noto Sans

    position = 0, 80
    halign = center
    valign = center
}

